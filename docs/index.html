:root {
  color-scheme: light;
}
html {
  -webkit-text-size-adjust: 100%;
  text-rendering: optimizeLegibility;
}
body {
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
::selection {
  background: var(--color-brand-tint);
}
:focus-visible {
  outline: 2px solid var(--color-brand);
  outline-offset: 2px;
  border-radius: 6px;
}
.font-display {
  font-family: var(--font-display);
  letter-spacing: -0.025em;
  font-variation-settings: "opsz" 48;
}
h1, h2, h3 {
  text-wrap: balance;
}
.tabular {
  font-variant-numeric: tabular-nums;
}
.ticket {
  position: relative;
  display: grid;
  grid-template-columns: 84px 1fr;
}
@media (min-width: 640px) {
  .ticket {
    grid-template-columns: 104px 1fr;
  }
}
.ticket-stub {
  position: relative;
  border-right: 1.5px dashed var(--color-line-strong);
}
.ticket-stub::before, .ticket-stub::after {
  content: "";
  position: absolute;
  right: -9px;
  width: 16px;
  height: 16px;
  border-radius: 999px;
  background: var(--color-paper);
  border: 1px solid var(--color-line);
}
.ticket-on-forest .ticket-stub::before, .ticket-on-forest .ticket-stub::after {
  background: var(--color-forest);
  border-color: var(--color-forest);
}
.ticket-stub::before {
  top: -9px;
  clip-path: inset(50% 0 0 0);
}
.ticket-stub::after {
  bottom: -9px;
  clip-path: inset(0 0 50% 0);
}
.office-floor {
  background-color: var(--color-floor);
  background-image: repeating-linear-gradient(90deg, rgb(140 110 70 / 0.07) 0 1px, transparent 1px 11%), repeating-linear-gradient(0deg, rgb(140 110 70 / 0.05) 0 1px, transparent 1px 25%);
}
.signature-path {
  stroke-dasharray: 900;
  stroke-dashoffset: 900;
  animation: cosign-sign 1.4s 0.35s cubic-bezier(0.6, 0, 0.3, 1) forwards;
}
@keyframes cosign-sign {
  to {
    stroke-dashoffset: 0;
  }
}
.prose-cosign p + p {
  margin-top: 0.75rem;
}
@keyframes cosign-pulse {
  0% {
    box-shadow: 0 0 0 0 rgb(255 255 255 / 0.7);
  }
  70% {
    box-shadow: 0 0 0 6px rgb(255 255 255 / 0);
  }
  100% {
    box-shadow: 0 0 0 0 rgb(255 255 255 / 0);
  }
}
.live-dot {
  animation: cosign-pulse 2s infinite;
}
@keyframes cosign-in {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.animate-in {
  animation: cosign-in 180ms ease-out backwards;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

r considering subscriptions: offer design, cadence, churn, and the operations behind recurring orders.",audience:"Merchants with replenishable or collectible products.",topics:["Subscriptions","Retention","Operations"],stages:["First $100K","$100K\u2013$1M","$1M+"],memberCountSeed:150,criteria:["Running a subscription or planning one in the next six months"],discusses:["Offer design","Churn & win-back","Cadence","Fulfillment"],guidelines:["Share what worked and what didn't","No vendor pitches"],tone:4},{id:"c-ai",name:"Building with AI",tagline:"Practical AI for small commerce teams.",description:"Merchants comparing notes on where AI actually saves time: support, content, analysis, and operations, without losing what makes the brand theirs.",audience:"Any merchant experimenting with AI in their business.",topics:["AI & automation","Operations","Storefront"],stages:["Just launched","First $100K","$100K\u2013$1M","$1M+"],memberCountSeed:290,criteria:["Curious, hands-on, and willing to share experiments"],discusses:["Support workflows","Product content","Analysis","Guardrails"],guidelines:["Share prompts and workflows generously","Be honest about what didn't work"],tone:5}],sx=[{id:"s-storefront-teardown",title:"Storefront teardown hour",topic:"Storefront",hostId:"u-sam",format:"drop-in",communityId:"c-first100",stages:["Pre-launch","Just launched","First $100K"],start:j(20,"10:00"),durationMin:60,capacity:12,description:"Drop in with your store link and get a live, friendly teardown of your homepage, product page, and checkout. Sam works through as many stores as time allows.",expect:["Share your screen or paste your store link","Get 2\u20133 specific fixes you can make today","Hear feedback on other stores, too"]},{id:"s-ai-ops-clinic",title:"AI ops clinic: support, content and SOPs",topic:"AI & automation",hostId:"u-diego",format:"drop-in",communityId:"c-ai",stages:["Just launched","First $100K","$100K\u2013$1M","$1M+"],start:j(21,"12:00"),durationMin:45,capacity:1  flow check-in",topic:"Inventory & cash flow",hostId:"u-alex",format:"one-to-one",communityId:"c-apparel",stages:["First $100K","$100K\u2013$1M"],start:j(22,"08:00"),slots:[j(22,"08:00"),j(23,"08:00"),j(27,"09:30")],durationMin:45,capacity:1,description:"Sanity-check your next purchase order with someone who has planned dozens. Bring your sell-through and cash position; leave with a clearer reorder plan.",expect:["Review your last season's sell-through","Pressure-test your next PO","Build a simple reorder rule"]},{id:"s-first-hire",title:"Making your first hire",topic:"Hiring",hostId:"u-jordan",format:"group",communityId:"c-vancouver",stages:["First $100K","$100K\u2013$1M"],start:j(26,"16:00"),durationMin:60,capacity:6,description:"When to hire, who to hire first, and how to write a role that attracts the right person. Jordan shares the job descriptions and onboarding docs Hearth & Grain actually used.",expect:["Decide part-time vs. contractor vs. full-time","See real (anonymized) job descriptions","Plan a first-week onboarding"]},{id:"s-first-retailers",title:"Getting into your first 10 retailers",topic:"Wholesale",hostId:"u-priya",format:"group",communityId:"c-vancouver",stages:["First $100K","$100K\u2013$1M"],start:j(27,"11:00"),durationMin:60,capacity:8,description:"From line sheets to follow-ups: how Priya approached specialty grocers and what made buyers say yes. Bring your line sheet or pitch for feedback.",expect:["Line sheet and pricing review","Outreach scripts that worked","Terms to ask for (and avoid)"]},{id:"s-subscription-offer",title:"Designing a subscription offer",topic:"Subscriptions",hostId:"u-priya",format:"one-to-one",communityId:"c-subs",stages:["First $100K","$100K\u2013$1M"],start:j(23,"15:00"),slots:[j(23,"15:00"),j(28,"10:00")],durationMin:30,capacity:1,description:"Is a subscription right for your product? Work through cadence, pricing, and the offer that makes people stay with someone who runs one.",expect:["Pick a cadence that matches real usage","Price the offer without eroding margin","Plan your first churn-saver"]},{id:"s-conversion-quick-wins",title:"Conversion quick wins for new stores",topic:"Conversion",hostId:"u-sam",format:"group",communityId:"c-first100",stages:["Just launched","First $100K"],start:j(22,"14:00"),durationMin:45,capacity:8,description:"A focused small-group session on the handful of changes that most often lift conversion for new stores: product photography, shipping clarity, trust signals, and checkout friction.",expect:["Read your funnel in 10 minutes","Prioritize three fixes","Get peer eyes on your product page"]},{id:"s-acquisition-math",title:"Customer acquisition math, live Q&A",topic:"Acquisition",hostId:"u-lena",format:"drop-in",communityId:"c-dtc",stages:["First $100K","$100K\u2013$1M","$1M+"],start:j(23,"12:00"),durationMin:60,capacity:20,description:"Bring your numbers and your questions: payback periods, blended vs. paid CAC, and when to scale a channel. Lena works through real (anonymized) examples live.",expect:["Work through a payback calculation","Pressure-test your scaling plan","Open Q&A"]},{id:"s-ai-support",title:"Automating customer support with AI",topic:"AI & automation",hostId:"u-diego",format:"one-to-one",communityId:"c-ai",stages:["First $100K","$100K\u2013$1M","$1M+"],start:j(26,"10:00"),slots:[j(26,"10:00"),j(27,"15:00"),j(29,"10:00")],durationMin:30,capacity:1,description:"Map your support inbox and find what can be drafted, routed, or answered automatically, and what should always get a human.",expect:["Bring a week of support categories","Identify your top three automations","Set guardrails before you start"]},{id:"s-retention-basics",title:"Retention basics for young brands",topic:"Retention",hostId:"u-jordan",format:"group",communityId:"c-first100",stages:["Just launched","First $100K"],start:j(19,"15:00"),durationMin:45,capacity:8,description:"What to do after the first order: thank-you notes, the second-purchase nudge, and the simplest loyalty ideas that don't require an app.",expect:["Map your post-purchase experience","Plan a second-order nudge","Swap ideas with peers"]}],bt=(e,t,a,n={})=>({id:e,sessionId:t,userId:a,status:"booked",createdAt:j(15,"09:00"),...n}),lx=[...["u-hana","u-theo","u-amara","u-priya","u-lena","u-diego","u-jordan"].map((e,t)=>bt(`b-teardown-${t}`,"s-storefront-teardown",e,{status:"joined",createdAt:j(20,"10:05")})),bt("b-email-1","s-email-flows","u-hana",{question:"How long should a welcome series be for a store with only six products?"}),bt("b-email-2","s-email-flows","u-amara",{question:"How do you handle win-back emails for coffee subscribers who paused?"}),bt("b-email-3","s-email-flows","u-alex",{question:"Curious how you segment wholesale buyers vs. retail customers."}),...["u-jordan","u-lena","u-priya","u-sam","u-diego"].map((e,t)=>bt(`b-pricing-${t}`,"s-premium-pricing",e)),bt("b-paidsocial-1","s-first-paid-social","u-theo",{slot:j(22,"13:00"),question:"I have $1,500 to test with. How should I split it?"}),bt("b-inventory-1","s-inventory-checkin","u-lena",{slot:j(23,"08:00")}),bt("b-hire-1","s-first-hire","u-amara",{question:"Part-time roaster's assistant or part-time ops help first?"}),bt("b-hire-2","s-first-hire","u-hana"),...["u-amara","u-hana","u-sam","u-jordan"].map((e,t)=>bt(`b-retail-${t}`,"s-first-retailers",e)),...["u-theo","u-hana","u-amara","u-priya","u-diego"].map((e,t)=>bt(`b-cvr-${t}`,"s-conversion-quick-wins",e)),bt("b-retention-maya","s-retention-basics","u-maya",{question:"What's the simplest second-purchase nudge for skincare?",createdAt:j(14,"11:00")}),bt("b-retention-theo","s-retention-basics","u-theo"),bt("b-retention-hana","s-retention-basics","u-hana"),bt("b-jordan-ai","s-ai-support","u-jordan",{slot:j(27,"15:00"),question:"Mapping our wholesale order inbox."})],rx=[{id:"q-checkout-drop",title:"Add-to-cart looks fine but very few people finish checkout. Where do I look first?",body:"About 6% of visitors add to cart, but only around 1 in 5 of those complete checkout (illustrative numbers from my store). I offer free shipping over $60. Is this a shipping-cost surprise, a trust issue, or something else? What would you check first?",topic:"Conversion",authorId:"u-maya",communityId:"c-first100",createdAt:j(18,"20:15")},{id:"q-paid-social-budget",title:"How should I split a $1,500 paid social test budget?",body:"I've never run ads. I have $1,500 for a first test across Instagram and TikTok. Do I split by platform, by creative, or just pick one? How long before I know anything?",topic:"Acquisition",authorId:"u-theo",communityId:"c-first100",createdAt:j(17,"13:40")},{id:"q-popup-market",title:"Is a holiday pop-up market in Vancouver worth the booth fee?",body:"A December market is asking $450 for a weekend booth. I sell jewelry around $60\u2013$120. For those who've done local markets: did they pay off directly, or more through email signups and later orders?",topic:"Acquisition",authorId:"u-hana",communityId:"c-vancouver",createdAt:j(16,"09:20")},{id:"q-first-employee",title:"When did you know it was time to hire your first part-time employee?",body:"I'm roasting, packing, and doing caf\xE9 deliveries myself. I can afford maybe 15 hours a week of help. What did you hand off first and how did you know it was time?",topic:"Hiring",authorId:"u-amara",communityId:"c-vancouver",createdAt:j(15,"18:05")},{id:"q-repeat-rate",title:"What's a reasonable repeat purchase rate for a seasonal product?",body:"Swimwear is seasonal and people don't need a new suit every month. How do you think about retention for a product like this, and what should I compare myself to?",topic:"Retention",authorId:"u-lena",communityId:"c-dtc",createdAt:j(14,"11:30")},{id:"q-net30",title:"Net 30 or payment upfront for first wholesale orders?",body:"A new specialty grocer wants Net 30 on a first order. I'm a small team and cash matters. What terms do you offer new accounts?",topic:"Wholesale",authorId:"u-priya",communityId:"c-vancouver",createdAt:j(13,"16:00")},{id:"q-reorder-cadence",title:"Subscription setup for a product people reorder every 6\u20138 weeks?",body:"Customers reorder my planner refills every 6 to 8 weeks, but not on a perfect schedule. Should I offer a fixed cadence, let people choose, or skip subscriptions and use reminders?",topic:"Subscriptions",authorId:"u-theo",communityId:"c-subs",createdAt:j(12,"10:10")},{id:"q-jewelry-photos",title:"How do you photograph jewelry without a studio budget?",body:"My product photos look flat and the silver reads gray. I have a phone, a window, and maybe $100 for gear. Any setups that worked for you?",topic:"Storefront",authorId:"u-hana",communityId:"c-first100",createdAt:j(19,"19:45")},{id:"q-ai-descriptions",title:"Anyone using AI to draft product descriptions without losing brand voice?",body:"We have 60 SKUs and descriptions are inconsistent. I'd like to use AI for first drafts, but early tests sounded generic. What's your workflow?",topic:"AI & automation",authorId:"u-jordan",communityId:"c-ai",createdAt:j(16,"14:25")},{id:"q-seasonal-forecast",title:"How do you forecast inventory with only one season of data?",body:"I sold through my holiday blend last year but have no other history. How do you size the second run without overbuying?",topic:"Inventory & cash flow",authorId:"u-amara",communityId:"c-dtc",createdAt:j(11,"08:50")},{id:"q-raise-prices",title:"Raise prices before the holidays or after?",body:"My costs went up and my margins are thin. Is it better to raise prices now, before holiday traffic, or wait until January?",topic:"Positioning",authorId:"u-theo",communityId:"c-first100",createdAt:j(19,"08:30")},{id:"q-first-flows",title:"Which email flow should I set up first?",body:"I have about 400 subscribers from markets and a waitlist, and no automated emails at all. If I can only set up one flow this month, which one?",topic:"Retention",authorId:"u-hana",communityId:"c-first100",createdAt:j(20,"07:55")}],ux=[{id:"r-checkout-sam",questionId:"q-checkout-drop",authorId:"u-sam",body:"Start with the shipping surprise. Put your shipping threshold on the product page and in the cart, not just the footer. Then do a test order on your phone and time it: if you hit an account wall or more than one page of fields, that's your next fix. I'm doing teardowns this morning if you want to drop in.",createdAt:j(20,"08:10")},{id:"r-checkout-hana",questionId:"q-checkout-drop",authorId:"u-hana",body:"Same thing happened to me. Adding express checkout buttons and a short returns line under the price helped more than anything else I tried.",createdAt:j(20,"09:02")},{id:"r-paid-lena",questionId:"q-paid-social-budget",authorId:"u-lena",body:"Pick one platform for the first test so you learn something. Split the budget across 3\u20134 creative angles, not audiences. Give it at least 7\u201310 days and decide beforehand what cost per purchase would make you keep going.",createdAt:j(17,"16:20")},{id:"r-paid-jordan",questionId:"q-paid-social-budget",authorId:"u-jordan",body:"Plus one to Lena. Also hold back about a third of the budget to double down on whatever wins. Our first test 'failed' on purchases but taught us which product photo people stopped for.",createdAt:j(18,"10:00")},{id:"r-popup-amara",questionId:"q-popup-market",authorId:"u-amara",body:"For me, markets roughly broke even on the day. The real value was the email list: bring a QR code with a small first-order incentive. Most of my December online orders came from market signups.",createdAt:j(16,"12:40")},{id:"r-hire-jordan",questionId:"q-first-employee",authorId:"u-jordan",body:"Hand off the work that's repeatable and doesn't need your taste: packing and shipping was ours. The signal was when I was saying no to wholesale conversations because I had boxes to pack. I'm running a small group on this next week.",createdAt:j(16,"08:30")},{id:"r-hire-priya",questionId:"q-first-employee",authorId:"u-priya",body:"Write down every task you did for two weeks with the time it took. The list made the decision obvious for me, and became the job description.",createdAt:j(16,"11:15")},{id:"r-repeat-jordan",questionId:"q-repeat-rate",authorId:"u-jordan",body:"Compare yourself cohort-to-cohort rather than against other categories. For seasonal products, I'd watch year-over-year return rate and whether people buy adjacent items (cover-ups, accessories) between seasons.",createdAt:j(14,"15:00")},{id:"r-net30-alex",questionId:"q-net30",authorId:"u-alex",body:"We ask for payment upfront or a deposit on the first order, then offer Net 30 after two on-time reorders. Most good retailers understand. Put it in writing on the line sheet so it's not a negotiation each time.",createdAt:j(13,"19:30")},{id:"r-reorder-priya",questionId:"q-reorder-cadence",authorId:"u-priya",body:"Let people choose between 6 and 8 weeks and make 'send now' and 'skip' one click. A rigid cadence creates pile-ups, and pile-ups create cancellations.",createdAt:j(12,"14:45")},{id:"r-ai-diego",questionId:"q-ai-descriptions",authorId:"u-diego",body:"Write a one-page voice guide with five of your best descriptions as examples, and give the model that every time. Have it draft, but a human always edits the opening line and the material details. Generic output usually means generic input.",createdAt:j(16,"17:05")},{id:"r-forecast-alex",questionId:"q-seasonal-forecast",authorId:"u-alex",body:"Look at when you sold out, not just how much you sold. If you sold out early, true demand was higher. Size the second run modestly above last year and pre-sell the rest so customers fund the difference.",createdAt:j(11,"13:20")},{id:"r-repeat-priya",questionId:"q-repeat-rate",authorId:"u-priya",body:"A pre-season 'early access' email to past buyers worked well for us with seasonal blends. Gives people a reason to come back on your schedule.",createdAt:j(15,"09:40")}],cx={"r-checkout-sam":["u-hana","u-theo"],"r-paid-lena":["u-theo","u-maya","u-hana"],"r-paid-jordan":["u-theo"],"r-popup-amara":["u-hana","u-lena"],"r-hire-jordan":["u-amara","u-priya","u-hana"],"r-hire-priya":["u-amara"],"r-net30-alex":["u-priya","u-amara"],"r-ai-diego":["u-jordan","u-sam"],"r-forecast-alex":["u-amara"]},dx=[{id:"res-first-100",title:"The first-100-orders checklist",type:"Checklist",topic:"Acquisition",summary:"The unglamorous steps merchants in the First 100 Orders circle say got them from launch to steady orders.",minutes:6,communityId:"c-first100",authorId:"u-sam",sessionIds:["s-conversion-quick-wins","s-first-paid-social"],sections:[{heading:"Before you spend on ads",body:"Make sure a stranger can understand what you sell, why it costs what it does, and when it will arrive, all without scrolling on a phone. Ask three people outside your circle to buy something and narrate what confuses them."},{heading:"Your first 30 customers",body:"Most early orders come from people who already know you. Make a list of 100 people, tell them personally, and ask the ones who buy for a photo and a sentence you can share."},{heading:"Your next 70",body:"Pick one channel and get decent at it: a local market, a community, a creator partnership, or a small paid test. Spreading thin across five channels usually means learning nothing from any of them."}]},{id:"res-email-flows",title:"Three email flows to launch before your next sale",type:"Playbook",topic:"Retention",summary:"How Hearth & Grain structures welcome, post-purchase, and win-back emails, with example timing.",minutes:8,communityId:"c-dtc",authorId:"u-jordan",sessionIds:["s-email-flows","s-retention-basics"],sections:[{heading:"Welcome (3 emails over a week)",body:"Introduce the people behind the brand, answer the top objection, then show your best-loved products with honest reviews. Skip the discount on day one if your margin can't support it."},{heading:"Post-purchase (2\u20133 emails)",body:"Confirm and set expectations, then teach people to get the most from what they bought. The second-purchase suggestion goes last, once they've used t
